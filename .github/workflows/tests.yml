name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        # The app icon is an Icon Composer .icon authored by a newer toolchain
        # than the runner's actool, which crashes compiling it. The icon is not
        # needed to run unit tests, so it is disabled for the CI build only.
        run: |
          xcodebuild test \
            -project JSONParser/JSONParser.xcodeproj \
            -scheme JSONParser \
            -destination 'platform=macOS' \
            -only-testing:JSONParserTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
